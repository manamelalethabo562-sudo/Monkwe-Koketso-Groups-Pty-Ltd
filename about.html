<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About TAKEDI | Modern Printers & Supply</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3E4095;
            --accent: #F58634;
            --light-blue: #00AFEF;
            --white: #FFFFFF;
            --bg-light: #FBFBFF;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-light);
            color: #333;
            line-height: 1.7;
            overflow-x: hidden;
        }
        h1, h2, h3 { color: var(--primary); font-weight: 700; }
        p { color: #555; }
        a { text-decoration: none; transition: var(--transition); }

        /* ─── NAVBAR (unchanged) ────────────────────────────────────────────── */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 12px 35px;
            z-index: 1000;
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: var(--transition);
        }
        nav.scrolled {
            top: 0;
            width: 100%;
            border-radius: 0;
            padding: 10px 5%;
            background: rgba(255, 255, 255, 0.98);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }
        .nav-logo-text {
            color: var(--primary);
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .menu-wrapper {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 28px;
            color: #222;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
            margin: 0;
            padding: 0;
        }
        nav ul li a {
            color: #222;
            font-weight: 600;
            font-size: 14px;
            position: relative;
        }
        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: var(--transition);
        }
        nav ul li a:hover::after { width: 100%; }
        nav ul li a:hover { color: var(--accent); }
        nav ul li a.active { color: var(--accent); }
        nav ul li a.active::after { width: 100%; }
        .nav-cta {
            background: var(--accent);
            color: white !important;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(245,134,52,0.3);
            letter-spacing: 1px;
        }
        .nav-cta:hover {
            background: var(--primary);
            transform: scale(1.05);
        }

        /* ─── Your existing header, sections, footer styles remain unchanged ─── */
        /* ... (all your original styles for header, main, sections, footer, media queries) ... */

        /* ─── MODERN MODAL STYLES (copied from your home page) ──────────────── */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background-color: rgba(11, 12, 31, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.3s ease forwards;
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: #ffffff;
            margin: auto;
            padding: 40px 35px;
            border: none;
            width: 90%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            animation: slideUpModal 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
            color: var(--primary);
            text-align: center;
        }
        .close {
            color: #999;
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 28px;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f4f4f4;
            z-index: 10;
        }
        .close:hover {
            color: var(--white);
            background: var(--accent);
            cursor: pointer;
            transform: rotate(90deg);
        }
        form label {
            display: block;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        form input, form textarea {
            width: 100%;
            padding: 12px 15px;
            margin-top: 0;
            box-sizing: border-box;
            background: #F5F5FA;
            border: 2px solid transparent;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #333;
            transition: all 0.3s ease;
        }
        form input:focus, form textarea:focus {
            outline: none;
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(245,134,52,0.1);
        }
        form textarea {
            resize: vertical;
            min-height: 100px;
        }
        form input[type="submit"] {
            background: linear-gradient(135deg, var(--accent), #FF6B6B);
            color: white;
            border: none;
            padding: 14px 20px;
            margin-top: 30px;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        form input[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(245, 134, 52, 0.4);
        }
        @media (max-width: 600px) {
            .modal-content {
                width: 95%;
                padding: 25px 20px;
                margin: 20px auto;
            }
            .modal-content h2 { font-size: 24px; margin-bottom: 20px; }
            .close { top: 15px; right: 15px; width: 28px; height: 28px; font-size: 24px; }
        }
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUpModal {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Your existing media queries and other styles remain here unchanged */
    </style>
</head>
<body>

    <!-- Your original navbar – only CTA link changed -->
    <nav id="navbar">
        <div class="nav-left">
            <img src="https://i.postimg.cc/5yzF4Q9V/takedilogo.png" alt="TAKEDI Logo" class="nav-avatar">
            <div class="nav-logo-text">TAKEDI</div>
            <div class="hamburger" id="hamburger"><i class="fas fa-bars"></i></div>
        </div>
        <div class="menu-wrapper">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html" class="active">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <a href="#" class="nav-cta" onclick="openModal()">GET A QUOTE</a>
        </div>
    </nav>

    <!-- ── Your complete original header + main + footer content (unchanged) ── -->
    <header id="about">
        <div class="hero-label">Precision & Quality</div>
        <h1 class="company-name">ABOUT US</h1>
        <div class="slogan">Modern Printers & Supply</div>
    </header>

    <main>
        <!-- ... all your original sections (intro, values, mission-vision, leadership) ... -->
        <!-- Keep everything exactly as it was -->
    </main>

    <footer>
        <!-- ... your original footer ... -->
    </footer>

    <!-- ── NEW: The quote modal (same as on homepage) ── -->
    <div id="quoteModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Request a Quote</h2>
            <form action="mailto:info@takedi.co.za" method="post" enctype="text/plain">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="012 345 6789">
                
                <label for="message">Message Details</label>
                <textarea id="message" name="message" placeholder="Describe what you need printed..." required></textarea>
                
                <input type="submit" value="Send Request">
            </form>
        </div>
    </div>

    <!-- Your original scripts + new modal scripts -->
    <script>
        // ── Your original IntersectionObserver + scroll + hamburger code ──
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('section').forEach(s => observer.observe(s));

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 80) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });

        const hamburger = document.getElementById('hamburger');
        const navbar = document.getElementById('navbar');
        
        if (hamburger && navbar) {
            hamburger.addEventListener('click', () => {
                navbar.classList.toggle('expanded');
                const icon = hamburger.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-times');
            });
        }

        // ── NEW: Modal controls ──
        function openModal() {
            document.getElementById("quoteModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("quoteModal").style.display = "none";
        }

        window.onclick = function(event) {
            var modal = document.getElementById("quoteModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
